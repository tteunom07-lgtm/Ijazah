<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data Verifikasi Ijazah</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-xl w-full">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center border-b pb-4">Input Data Ijazah Digital USK</h2>
        
        <form action="/cetak" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Nama Lengkap</label>
                <input type="text" name="namaLengkap" value="MUHAMMAD IQBAL" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Nomor Induk Mahasiswa (NIM)</label>
                <input type="text" name="nim" value="2001102010031" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Nomor Ijazah Nasional</label>
                <input type="text" name="nomorIjazahNasional" value="4030120250000845" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Program Studi / Jenjang</label>
                <input type="text" name="programStudi" value="S1 - Manajemen" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Fakultas</label>
                <input type="text" name="fakultas" value="Fakultas Ekonomi Dan Bisnis" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Jenis Ijazah</label>
                <input type="text" name="jenisIjazah" value="Sarjana (S1)" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Tanggal Kelulusan</label>
                <input type="text" name="tanggalKelulusan" value="6 Januari 2025" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Tanggal Terbit Dokumen</label>
                <input type="text" name="tanggalTerbit" value="1 Februari 2025" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 mt-6 shadow-md">
                Generate Verifikasi Ijazah
            </button>
        </form>
    </div>

</body>
</html>
