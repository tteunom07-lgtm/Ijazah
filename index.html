<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Ijazah Digital</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 300px; border-top: 5px solid #28a745; }
        .check-icon { font-size: 50px; color: #28a745; }
        h2 { color: #333; margin: 10px 0; }
        p { color: #666; font-size: 14px; }
        .status { font-weight: bold; color: #28a745; background: #e8f5e9; padding: 5px 10px; border-radius: 20px; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check-icon">✓</div>
        <h2>Data Terverifikasi</h2>
        <p>Ijazah ini telah divalidasi oleh sistem dan dinyatakan <strong>ASLI</strong>.</p>
        <div class="status">VALID / ORIGINAL</div>
        <hr>
        <p style="font-size: 12px;">ID Verifikasi: ID-1778866751</p>
    </div>
</body>
</html>
